plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tbulu.adfree'
    compileSdk 34

    defaultConfig {
        applicationId "com.tbulu.adfree"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
